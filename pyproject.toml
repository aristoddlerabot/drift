[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "drift-tracker"
version = "0.1.0"
description = "CLI energy & fatigue tracker — log levels, spot patterns, manage recovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [
    { name = "aristoddlerabot" },
]
keywords = ["energy", "fatigue", "tracker", "concussion", "health", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
drift = "drift:main"

[project.urls]
Repository = "https://github.com/aristoddlerabot/drift"
